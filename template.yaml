Description: AWS CloudFormation - ALB and Auto Scaling Group for WebServers

Parameters:
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'
  InstanceType:
    Type: String
    Default: t3.micro
  VpcId:
    Type: 'AWS::EC2::VPC::Id'
    Description: Select a VPC
  Subnets:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: Select at least two subnets

Resources:
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  WebServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd

            # Creates the full HTML, CSS, and JS application
            cat <<'EOF' > /var/www/html/index.html
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <title>Budget Visualizer</title>
              <style>
                :root { --bg: #f4f7f6; --primary: #4a90e2; --success: #2ecc71; --danger: #e74c3c; --text: #2c3e50; }
                body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
                .container { max-width: 500px; margin: auto; }
                .header { text-align: center; margin-bottom: 20px; }
                .balance-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
                .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
                .card { padding: 15px; border-radius: 12px; color: white; text-align: center; }
                .income { background: var(--success); }
                .expense { background: var(--danger); }
                .form-section { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
                input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
                .radio-group { display: flex; gap: 10px; margin-bottom: 10px; }
                .radio-group button { flex: 1; padding: 10px; cursor: pointer; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
                .radio-group button.active { background: var(--primary); color: white; border-color: var(--primary); }
                .submit-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
                .transaction-list { list-style: none; padding: 0; }
                .item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ccc; }
                .item.income { border-left-color: var(--success); }
                .item.expense { border-left-color: var(--danger); }
                .del-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 18px; }
                .del-btn:hover { color: var(--danger); }
              </style>
            </head>
            <body>
              <div class="container">
                <header class="header">
                  <h1>Budget Visualizer</h1>
                  <div class="balance-card">
                    <span>Current Balance</span>
                    <h2 id="balance">$0.00</h2>
                  </div>
                </header>

                <div class="stats-grid">
                  <div class="card income"><h4>Income</h4><p id="inc-amt">+$0.00</p></div>
                  <div class="card expense"><h4>Expenses</h4><p id="exp-amt">-$0.00</p></div>
                </div>

                <div class="form-section">
                  <h3>Add Transaction</h3>
                  <div class="radio-group">
                    <button id="type-inc" class="active" onclick="setType('income')">Income</button>
                    <button id="type-exp" onclick="setType('expense')">Expense</button>
                  </div>
                  <input type="text" id="desc" placeholder="Description...">
                  <input type="number" id="amount" placeholder="Amount...">
                  <button class="submit-btn" onclick="addTransaction()">Add Transaction</button>
                </div>

                <h3>History</h3>
                <ul id="list" class="transaction-list"></ul>
              </div>

              <script>
                let transactions = [];
                let currentType = 'income';

                function setType(type) {
                  currentType = type;
                  document.getElementById('type-inc').classList.toggle('active', type === 'income');
                  document.getElementById('type-exp').classList.toggle('active', type === 'expense');
                }

                function addTransaction() {
                  const desc = document.getElementById('desc').value;
                  const amt = parseFloat(document.getElementById('amount').value);
                  if (!desc || isNaN(amt)) return alert('Please enter valid data');

                  const transaction = { id: Date.now(), desc, amt: currentType === 'expense' ? -amt : amt, type: currentType };
                  transactions.push(transaction);
                  updateUI();
                  document.getElementById('desc').value = '';
                  document.getElementById('amount').value = '';
                }

                function deleteTransaction(id) {
                  transactions = transactions.filter(t => t.id !== id);
                  updateUI();
                }

                function updateUI() {
                  const list = document.getElementById('list');
                  const balance = document.getElementById('balance');
                  const incDisplay = document.getElementById('inc-amt');
                  const expDisplay = document.getElementById('exp-amt');

                  list.innerHTML = '';
                  let total = 0, inc = 0, exp = 0;

                  transactions.forEach(t => {
                    total += t.amt;
                    t.amt > 0 ? inc += t.amt : exp += Math.abs(t.amt);
                    
                    const li = document.createElement('li');
                    li.className = `item ${t.type}`;
                    li.innerHTML = `<span>${t.desc}</span> <span>${t.amt > 0 ? '+' : '-'}$${Math.abs(t.amt).toFixed(2)}</span>
                                    <button class="del-btn" onclick="deleteTransaction(${t.id})">&times;</button>`;
                    list.appendChild(li);
                  });

                  balance.innerText = `$${total.toFixed(2)}`;
                  incDisplay.innerText = `+$${inc.toFixed(2)}`;
                  expDisplay.innerText = `-$${exp.toFixed(2)}`;
                }
              </script>
            </body>
            </html>
            EOF

  # Infrastructure Resources
  PublicALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      SecurityGroups: [!Ref ALBSecurityGroup]
      Subnets: !Ref Subnets

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref WebTargetGroup }]
      LoadBalancerArn: !Ref PublicALB
      Port: 80
      Protocol: HTTP

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId

  WebASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref WebServerLaunchTemplate
        Version: !GetAtt WebServerLaunchTemplate.LatestVersionNumber
      MaxSize: '2'
      MinSize: '1'
      DesiredCapacity: '1'
      VPCZoneIdentifier: !Ref Subnets
      TargetGroupARNs: [!Ref WebTargetGroup]

Outputs:
  WebsiteURL:
    Description: Your new Budget Visualizer URL
    Value: !Sub 'http://${PublicALB.DNSName}'
