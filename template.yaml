Description: AWS CloudFormation - ALB and Auto Scaling Group for WebServers

Parameters:
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'
  InstanceType:
    Type: String
    Default: t3.micro
  VpcId:
    Type: 'AWS::EC2::VPC::Id'
    Description: Select a VPC
  Subnets:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: Select at least two subnets

Resources:
  # Security Group for the Load Balancer (Public)
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # Security Group for Instances (Allows traffic from ALB)
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  # Launch Template (The modern successor to Launch Configuration)
  WebServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd
            echo "<!DOCTYPE html>
<html>
<head>
<style>
:root {
  --bg: #f4f7f6;        /* light grey back ground, except "Current Balance" chart and "Add New Transaction" chart.*/
  --primary: #4a90e2;   /* blue buttons for Income, Expense, and Add Trascaction. */
  --success: #2ecc71;   /* green Income box. */
  --danger: #e74c3c;    /* red Expense box. */
  --text: #2c3e50;      /* grey text: "Budget Visualizer." */
}


body { font-family: 'Inter', sans-serif; 
      background: var(--bg); 
      color: var(--text);
     }

.container { max-width: 500px;    /* 500 px or more preferred to keep the page spead out. */
            margin: 40px auto;    /* Space from the top of the page. */
            padding: 20px; }      /* An imaginary frame around the page.*/

.header { text-align: center;     /* "Budget Visualizer" and "Current Balance" are centered. */
         margin-bottom: 30px;     /* Space is kept from "Income" chart and "Expense" charts.*/
        }

.balance-card { 
  background: white;             /* "Current Balance" chart is white.*/
  padding: 20px;                 /* decides the size of the chart border.*/
  border-radius: 15px;           /* Rounded border corners. */
  box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
}

.stats-grid { 
             display: grid;                   /* Keeps "Income" and "Expenses" side by side*/
             grid-template-columns: 1fr 1fr;  /* Keeps them the same size*/
             gap: 15px;                       /* Keeps a gap between their borders. */
             margin: 20px 0;                  /* Space kept from "Add New Transaction" below." */
            }

.card { padding: 15px;        /* Manages the size of our Green and Red card. */
       border-radius: 12px;   /* Rounded corners.*/
       color: white;          /* Internal text color. */
       text-align: center;    /* Internal text position of these colored cards.*/
      }
.income { background: var(--success); }  /* Green. */
.expense { background: var(--danger); }  /* Red. */

.form-section { background: white; 
               padding: 20px;           /* Determines the size of "Add New Transaction" card. */
               border-radius: 15px;     /* Rounded corners of input boxes*/
               margin-bottom: 20px;     /* Distance from "History" table below.*/
              }

input { 
  width: 100%;              /* Width of "Description" and "Amount" */
  padding: 12px;            /* Height of "Description" and "Amount" */
  margin: 10px 0;           /* Space between "Description" and "Amount" boxes.*/
  border: 1px solid #ddd;   /* Thickness and the color grey for the border.*/
  border-radius: 8px;       /* Rounded*/
  box-sizing: border-box; 
}

.radio-group { display: flex;       /* Center the "Income" and "Expense" buttons.*/
              gap: 10px;            /* Space between two buttons.*/
              margin-bottom: 10px;  /* Space is kept from  the "Add Transaction" button below.*/
             }
.radio-group button { flex: 1;                /* "Income" and "Expense" buttons are centered. */
                     padding: 8px;            /*  Height of each button.*/
                     cursor: pointer; 
                     border: 1px solid #ddd;  /* Color and thickness of button borders*/
                     border-radius: 8px;      /* Rounded buttons*/
                    }
.radio-group button.active { background: var(--primary);  /* Background color of the active button is blue.*/
                            color: white;                 /* Text color of the active button.*/
                            border-color: var(--primary);
                           }

.submit-btn { 
  width: 100%;                  /* "Add Tansaction" button width.*/
  padding: 12px;                /* height of button.*/
  background: var(--primary);   /* Blue color for the button.*/
  color: white;                 /* Internal text color. */
  border: none;                
  border-radius: 8px;           
  cursor: pointer;
  transition: transform 0.2s;
}

.submit-btn:hover {              /* Wiggle effect for "Add Transaction" button.*/ 
  transform: translateY(-2px); 
}

.transaction-list { list-style: none; padding: 0; }  /* "History" table width.*/
.item { 
  background: white;              /* Color of history table background.*/
  margin-bottom: 10px;            /* Space kept in between each data entry.*/
  padding: 15px;                  /* Each data entry size.*/
  border-radius: 10px;            /* rounded corners of table fields.*/
  display: flex;                  /* Keeps "Description" and "Amount" on far sides of each other.*/
  justify-content: space-between; /* Keeps the text separated (Description and Amount)*/
  align-items: center;
  border-left: 5px solid #ccc;    /* colored tabs on left of History table indicating added or subtracted.*/
  animation: fadeIn 0.4s ease;
}

.item.income { border-left-color: var(--success); }  /* Green color for "Income" of left corner border tabs */
.item.expense { border-left-color: var(--danger); }  /* Red color for "Expenses" of left corner border tabs */

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.del-btn { background: none;      /* Delete button has an X on it.*/
          border: none; 
          color: #ccc;            /* color of the "X" text.*/
          cursor: pointer; 
          font-size: 20px;        /* Font size of the delete "X" button.*/
         }
.del-btn:hover { color: var(--danger); }   /* The delete button "mouse hover over" color is red.*/
.error-msg { color: var(--danger); font-size: 0.8em; } 
</style>
</head>
<body>

<div class="container">
    <header class="header">
        <h1>Budget Visualizer</h1>
        <div class="balance-card">
            <span>Current Balance</span>
            <h2 id="balance-display">$0.00</h2>
        </div>
    </header>

    <div class="stats-grid">
        <div class="card income">
            <h4>Income</h4>
            <p id="income-display">+$0.00</p>
        </div>
        <div class="card expense">
            <h4>Expenses</h4>
            <p id="expense-display">-$0.00</p>
        </div>
    </div>

    <section class="form-section">
        <h3>Add New Transaction</h3>
        <form id="budget-form">
            <p id="error-msg" class="error-msg" style="display: none;"></p>
            <input type="text" id="description" placeholder="Description (e.g., Grocery, Salary)" />
            <input type="number" id="amount" placeholder="Amount" />
            <div class="radio-group">
                <button type="button" id="btn-income" class="type-btn">Income</button>
                <button type="button" id="btn-expense" class="type-btn active">Expense</button>
            </div>
            <button type="submit" class="submit-btn">Add Transaction</button>
        </form>
    </section>

    <section class="history">
        <h3>History</h3>
        <ul id="transaction-list" class="transaction-list"></ul>
    </section>
</div>
/////////////////////////// 
<script>
// --- STATE MANAGEMENT ---
let transactions = JSON.parse(localStorage.getItem('budget_data')) || [];
let currentType = 'expense';

// --- SELECTORS ---
const form = document.getElementById('budget-form');
const list = document.getElementById('transaction-list');
const balanceEl = document.getElementById('balance-display');
const incomeEl = document.getElementById('income-display');
const expenseEl = document.getElementById('expense-display');
const errorEl = document.getElementById('error-msg');

// --- CORE FUNCTIONS ---

function updateTotals() {
    const income = transactions
        .filter(t => t.type === 'income')
        .reduce((acc, curr) => acc + curr.amount, 0);

    const expenses = transactions
        .filter(t => t.type === 'expense')
        .reduce((acc, curr) => acc + curr.amount, 0);

    const balance = income - expenses;

    // Update UI
    balanceEl.textContent = `$${balance.toFixed(2)}`;
    balanceEl.className = balance >= 0 ? 'pos' : 'neg';
    incomeEl.textContent = `+$${income.toFixed(2)}`;
    expenseEl.textContent = `-$${expenses.toFixed(2)}`;
    
    // Save to LocalStorage (Replacement for useEffect)
    localStorage.setItem('budget_data', JSON.stringify(transactions));
}

function renderTransactions() {
    list.innerHTML = transactions.length === 0 ? '<p class="empty">No transactions yet.</p>' : '';

    transactions.forEach(t => {
        const li = document.createElement('li');
        li.className = `item ${t.type}`;
        li.innerHTML = `
            <div class="item-info">
                <strong>${t.description} </strong>
                <small>${t.date}</small>
            </div>
            <div class="item-amount">
                <span>${t.type === 'income' ? '+' : '-'}$${t.amount.toFixed(2)}</span>
                <button class="del-btn" onclick="deleteTransaction(${t.id})">×</button>
            </div>
        `;
        list.appendChild(li);
    });
}

window.deleteTransaction = (id) => {
    transactions = transactions.filter(t => t.id !== id);
    render();
};

function render() {
    updateTotals();
    renderTransactions();
}

// --- EVENT LISTENERS ---

// Toggle Income/Expense buttons
document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentType = e.target.id === 'btn-income' ? 'income' : 'expense';
    });
});

form.addEventListener('submit', (e) => {
    e.preventDefault();
    const desc = document.getElementById('description').value;
    const amt = document.getElementById('amount').value;

    if (!desc.trim() || !amt || parseFloat(amt) <= 0) {
        errorEl.textContent = 'Please provide a valid description and a positive amount.';
        errorEl.style.display = 'block';
        return;
    }

    const newTransaction = {
        id: Date.now(),
        description: desc,
        amount: parseFloat(amt),
        type: currentType,
        date: new Date().toLocaleDateString()
    };

    transactions.push(newTransaction);
    
    // Reset Form
    form.reset();
    errorEl.style.display = 'none';
    render();
});

// Initial Load
render();
///////////////////////////
</script>
</body>
</html>" > /var/www/html/index.html

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets: !Ref Subnets
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId

  # Auto Scaling Group
  WebServerASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref Subnets
      LaunchTemplate:
        LaunchTemplateId: !Ref WebServerLaunchTemplate
        Version: !GetAtt WebServerLaunchTemplate.LatestVersionNumber
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      TargetGroupARNs:
        - !Ref ALBTargetGroup

Outputs:
  ALBURL:
    Description: The URL of the Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
