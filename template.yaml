Description: AWS CloudFormation - ALB and Auto Scaling Group for WebServers

Parameters:
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'
  InstanceType:
    Type: String
    Default: t3.micro
  VpcId:
    Type: 'AWS::EC2::VPC::Id'
    Description: Select a VPC
  Subnets:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: Select at least two subnets

Resources:
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  WebServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        UserData:
          Fn::Base64: 
            !Sub |
              #!/bin/bash
              yum update -y
              yum install -y httpd
              systemctl start httpd
              systemctl enable httpd
              cat > /var/www/html/index.html <<'EOF'
              <!DOCTYPE html>
              <html>
              <head>
                <style>
                  :root { --bg: #f4f7f6; --primary: #4a90e2; --success: #2ecc71; --danger: #e74c3c; }
                  body { font-family: sans-serif; background: var(--bg); text-align: center; }
                  .container { max-width: 400px; margin: 50px auto; background: white; padding: 20px; border-radius: 10px; }
                  input { width: 90%; padding: 10px; margin: 10px 0; }
                  button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; cursor: pointer; }
                </style>
              </head>
              <body>
                <div class="container">
                  <h1>Budget Tracker</h1>
                  <h2 id="b">$0.00</h2>
                  <input type="text" id="d" placeholder="Description">
                  <input type="number" id="a" placeholder="Amount">
                  <button onclick="add()">Add Transaction</button>
                  <ul id="l"></ul>
                </div>
                <script>
                  let t = [];
                  function add() {
                    const d = document.getElementById('d').value;
                    const a = parseFloat(document.getElementById('a').value);
                    if(d && !isNaN(a)) {
                      t.push({d, a});
                      const l = document.getElementById('l');
                      l.innerHTML += "<li>" + d + ": $" + a + "</li>";
                      let total = t.reduce((acc, curr) => acc + curr.a, 0);
                      document.getElementById('b').innerText = "$" + total.toFixed(2);
                    }
                  }
                </script>
              </body>
              </html>
              EOF

  PublicLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      SecurityGroups: [!Ref ALBSecurityGroup]
      Subnets: !Ref Subnets

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref WebTargetGroup}]
      LoadBalancerArn: !Ref PublicLoadBalancer
      Port: 80
      Protocol: HTTP

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId

  WebServerASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref WebServerLaunchTemplate
        Version: !GetAtt WebServerLaunchTemplate.LatestVersionNumber
      MaxSize: '2'
      MinSize: '1'
      DesiredCapacity: '1'
      VPCZoneIdentifier: !Ref Subnets
      TargetGroupARNs: [!Ref WebTargetGroup]

Outputs:
  WebsiteURL:
    Value: !Sub 'http://${PublicLoadBalancer.DNSName}'
